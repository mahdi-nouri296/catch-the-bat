<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>catch-the-bat</title>
    <link rel="stylesheet" href="style/reset.css" />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="game-over hidden">
        <h1>GAME OVER</h1>
        <p>Score: <span class="final-score"></span></p>
        <p>Time: <span class="final-time"></span></p>
        <p>Record: <span class="final-record"></span></p>
        <button class="restart-btn">Play Again</button>
      </div>
      <header class="head">
        <div class="brand">
          <div class="icon"></div>
          <h2 class="label">TOUCH THE BAT GAME</h2>
        </div>
        <div class="record-box box-for-head">
          RECORD: <span id="record">00000000</span>
        </div>
        <div class="score-box box-for-head">
          SCORE: <span id="score">00000000</span>
        </div>
        <div class="timer-box box-for-head">
          <div class="icon-for-time"></div>
          <div class="disc-for-time">
            <span>TIME:</span>
            <span class="time">60</span>
          </div>
        </div>
        <div class="lives-box box-for-head">
          <span>LIVES:</span>
          <div class="container">
            <div class="live"></div>
            <div class="live"></div>
            <div class="live"></div>
          </div>
        </div>
      </header>

      <main class="game-area">
        <img src="gifs/zombie.gif" alt="" class="zombie" />
        <img src="gifs/zombie.gif" alt="" class="zombie" />
        <img src="gifs/zombie.gif" alt="" class="zombie" />
        <img src="gifs/Batman.gif" alt="Batman" class="player" />
        <img src="gifs/Bat.gif" alt="Bat" class="bat" />
      </main>
      <footer class="footer">
        <div class="footer-line"></div>
        <div class="footer-logo">
          <div class="footer-logo-img"></div>
        </div>

<div class="mobile-controls">
  <div class="controls">
    <button id="up" class="up" aria-label="Move up">↑</button>
    <button id="left" class="left" aria-label="Move left">←</button>
    <button id="down" class="down" aria-label="Move down">↓</button>
    <button id="right" class="right" aria-label="Move right">→</button>
  </div>
</div>

        </div>
      </footer>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
