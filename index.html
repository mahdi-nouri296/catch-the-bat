<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batman Hunt</title>
    <link rel="stylesheet" href="style/reset.css" />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="head">
        <div class="brand">
          <div class="icon"></div>
          <h2 class="label">Batman game</h2>
        </div>
        <div class="record-box box-for-head">
          RECORD: <span id="record">00000000</span>
        </div>
        <div class="score-box box-for-head">
          SCORE: <span id="score">00000000</span>
        </div>
        <div class="timer-box box-for-head">
          <div class="icon-for-time"></div>
          <div class="disc-for-time">
            <span>TIME:</span>
            <span class="time">60</span>
          </div>
        </div>
        <div class="lives-box box-for-head">
          <span>LIVES:</span>
          <div class="container">
            <div class="live"></div>
            <div class="live"></div>
            <div class="live"></div>
          </div>
        </div>
      </header>

      <main class="game-area">
        <img src="gifs/zombie.gif" alt="" class="zombie" />
        <img src="gifs/zombie.gif" alt="" class="zombie" />
        <img src="gifs/zombie.gif" alt="" class="zombie" />
        <img src="gifs/Batman.gif" alt="Batman" class="player" />
        <img src="gifs/Bat.gif" alt="Bat" class="bat" />
      </main>
      <footer class="footer">
        <div class="footer-line"></div>
        <div class="footer-logo">
          <div class="footer-logo-img"></div>
        </div>
        <div class="footer-logo">
          <div class="footer-logo-img"></div>
        </div>
        <div class="mobile-controls">
          <button id="up">↑</button>
          <button id="left">←</button>
          <button id="down">↓</button>
          <button id="right">→</button>
        </div>
      </footer>
      <div class="mobile-controls">
        <button id="up">↑</button>
        <button id="left">←</button>
        <button id="down">↓</button>
        <button id="right">→</button>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
